# Isolated configuration-resolution example. Use ONLY with ssh -G as shown.
# No private keys, includes, Match exec commands, or real destinations.
Host demo-specific
  HostName 192.0.2.10
  User developer
  IdentitiesOnly yes
  IdentityFile /example/project-key.pub

Host demo-additive
  HostName 192.0.2.10
  User developer
  IdentitiesOnly yes
  IdentityFile /example/project-key.pub

Host demo-public-selector
  HostName 192.0.2.10
  User developer
  IdentitiesOnly yes
  IdentityAgent /example/nonexistent-agent.sock
  IdentityFile /example/public-selector.pub

# Deliberately overlaps demo-additive, just as a broad Host * rule can.
Host demo-additive
  IdentityFile /example/another-key.pub

Host *
  BatchMode yes
  CanonicalizeHostname no
  ProxyCommand none
  StrictHostKeyChecking yes
